# The services the integration tests use, the same as CI
# (.github/workflows/ci.yml). make test-integration starts them;
# make services-down stops them and drops their data.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dygo
      POSTGRES_DB: dygo
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dygo
      MYSQL_DATABASE: dygo
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdygo"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
