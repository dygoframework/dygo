# Keeps dependencies and CI actions current (OWASP A06, A08). Each Go
# module is listed; minor and patch updates come grouped in one PR a week.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /validate/playground
      - /observe
      - /examples/http-users
      - /examples/academy
      - /queue/asynq
      - /micro/nats
      - /micro/grpc
      - /micro/redis
      - /micro/kafka
      - /ws
      - /graphql
      - /sql
      - /ai
      - /benchmarks
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
