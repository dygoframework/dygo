# docker compose up --build
# API and docs: http://localhost:9900/docs   Traces: http://localhost:16686
services:
  api:
    build:
      context: ../..
      dockerfile: examples/http-users/Dockerfile
    ports: ["9900:9900"]
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: http-users
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      CORS_ORIGINS: http://localhost:5173
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]
